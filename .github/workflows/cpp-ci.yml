name: Cpp CI Check

on:
  push:
    branches: [ main ]
    paths: 
      - 'cactus/**'
      - 'examples/cpp/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cactus/**' 
      - 'examples/cpp/**'

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup C++ Environment
      run: |
        brew install cmake coreutils

    - name: Build Cactus Core Library
      run: |
        cd cactus
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DDISABLE_METAL=ON
        make -j$(nproc)

    - name: Build C++ Examples
      run: |
        cd examples/cpp
        mkdir -p build && cd build
        cmake .. -DDISABLE_METAL=ON
        make -j$(nproc)

    - name: Verify Executables
      run: |
        cd examples/cpp/build
        for exe in cactus_llm cactus_embed cactus_vlm cactus_vlm_ffi cactus_tts; do
          test -f "$exe"
        done

    - name: Test cactus_llm
      run: chmod +x scripts/test-cpp-executables.sh && ./scripts/test-cpp-executables.sh cactus_llm

    - name: Test cactus_embed
      run: ./scripts/test-cpp-executables.sh cactus_embed

    - name: Test cactus_vlm
      run: ./scripts/test-cpp-executables.sh cactus_vlm

    - name: Test cactus_vlm_ffi
      run: ./scripts/test-cpp-executables.sh cactus_vlm_ffi

    - name: Test cactus_tts
      run: ./scripts/test-cpp-executables.sh cactus_tts